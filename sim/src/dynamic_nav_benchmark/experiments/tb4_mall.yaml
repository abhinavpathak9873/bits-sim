run_id: tb4_mall_example
world: mall
backend: ignition
robot: tb4_standard
seed: 21
crowd_density: medium
dynamic_obstacles: true
robot_start: {x: 0.0, y: -3.4, yaw: 1.57}
goals:
  - {name: atrium_info, x: 0.0, y: 0.0, yaw: 0.0}
timeout_s: 180
goal_tolerance_m: 0.45
scan_topic: /scan
odom_topic: /odom
cmd_vel_topic: /cmd_vel
goal_topic: /goal_pose
algorithm_launch: ros2 launch dynamic_nav_benchmark dummy_algorithm.launch.py
